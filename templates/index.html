<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Mi Primera Web con Flask!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .tarjeta {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #2c3e50; }
        p { color: #7f8c8d; font-size: 18px; }
        .cohete { font-size: 50px; }
    </style>
</head>
<body>

    <div class="tarjeta">
        <div class="cohete">🚀</div>
        <h1>¡Hola Mundo !</h1>
        <p>Esta página web está corriendo en un servidor Flask y publicada en Render.</p>
        <p><strong>Logro desbloqueado: ¡Desplegado con éxito!</strong></p>
    </div>

</body>
</html>
